name: Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission
        run: chmod +x gradlew

      # Build first so test-task failures cannot prevent an otherwise valid APK.
      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LuminaClient-debug
          path: '**/build/outputs/apk/debug/*.apk'
          if-no-files-found: error

      # Tests are reported separately and do not block APK creation.
      - name: Run unit tests
        id: unit-tests
        continue-on-error: true
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LuminaClient-test-reports
          path: '**/build/reports/tests/**'
          if-no-files-found: ignore

      - name: Report unit test status
        if: steps.unit-tests.outcome == 'failure'
        run: echo "::warning::Unit tests failed; see LuminaClient-test-reports. APK build status is reported separately."
